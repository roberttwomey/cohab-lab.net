<article class="card">
  <a
    {% if include.link %}href="{{ include.link | relative_url }}"{% endif %}
    class="card-image"
    aria-label="{{ include.title | default: "card link" }}"
    tabindex="-1"
  >
    <img
      src="{{ include.image | relative_url }}"
      alt="{{ include.title | default: "card image" }}"
      loading="lazy"
      {% include fallback.html %}
    >
  </a>

  {% if include.title %}
    <a
      {% if include.link %}href="{{ include.link | relative_url }}"{% endif %}
      class="card-title"
    >{{ include.title }}</a>
  {% endif %}

  {% if include.description %}
    <p class="card-description">
      {{ include.description | markdownify | remove: "<p>" | remove: "</p>" }}
    </p>
  {% endif %}

  {% if include.tags %}
    {% include tags.html tags=include.tags %}
  {% endif %}
</article>
