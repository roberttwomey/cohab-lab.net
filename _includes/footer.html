<footer class="site-footer">
  <div class="site-footer-inner">
    <div>
      &copy; {{ site.time | date: "%Y" }} {{ site.title }} &middot; UC San Diego
    </div>

    <div>
      {% for link in site.links %}
        {% assign key = link[0] %}
        {% assign value = link[1] %}
        {% include button.html type=key text="" link=value style="bare" %}
      {% endfor %}
    </div>
  </div>
</footer>
