<header class="site-header">
  <div class="site-header-inner">
    <a href="{{ "/" | relative_url }}" class="wordmark">
      <span class="wordmark-name">{{ site.title }}</span>
      {% if site.subtitle %}
        <span class="wordmark-sub">{{ site.subtitle }}</span>
      {% endif %}
    </a>

    <input class="nav-toggle" type="checkbox" aria-label="show/hide nav">

    <nav class="site-nav">
      {% assign pages = site.pages
        | where_exp: "page", "page.nav"
        | sort: "nav.order"
      %}
      {% for item in pages %}
        <a
          href="{{ item.dir | relative_url }}"
          {% if item.dir == page.dir %}aria-current="page"{% endif %}
        >
          {{ item.title }}
        </a>
      {% endfor %}
    </nav>
  </div>
</header>
