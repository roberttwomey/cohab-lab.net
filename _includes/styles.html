<!-- include all sass in styles folder -->
{% assign styles = site.pages
  | where_exp: "file", "file.url contains '/_styles'"
%}
{% for style in styles %}
  {% unless style.url contains ".map" %}
    <link
      href="{{ style.path | replace: ".scss", ".css" | relative_url }}"
      rel="stylesheet"
    />
  {% endunless %}
{% endfor %}
